<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100" fill="none">
    <defs>
        <linearGradient id="shieldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#047857" />
            <stop offset="50%" stop-color="#10B981" />
            <stop offset="100%" stop-color="#34D399" />
        </linearGradient>
        <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#FFFFFF" />
            <stop offset="100%" stop-color="#CBD5E1" />
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="6" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    
    <!-- Background (Transparent) -->
    
    <!-- Shield Icon Container -->
    <g transform="translate(20, 14)">
        <!-- Shield Background Glow -->
        <rect x="0" y="0" width="72" height="72" rx="20" fill="#10B981" fill-opacity="0.15" filter="url(#glow)"/>
        <!-- Shield Body -->
        <rect x="0" y="0" width="72" height="72" rx="20" fill="url(#shieldGrad)" stroke="#6EE7B7" stroke-width="1.5" />
        <!-- Filing / Checkmark Silhouette -->
        <path d="M22 24 H42 L50 32 V50 C50 51.1 49.1 52 48 52 H24 C22.9 52 22 51.1 22 50 V24 Z" fill="#07090E" fill-opacity="0.25"/>
        <!-- Pure Geometric Checkmark -->
        <path d="M24 37 L33 46 L49 27" stroke="#07090E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M24 37 L33 46 L49 27" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    
    <!-- Brand Typography -->
    <text x="110" y="60" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="38" font-weight="800" letter-spacing="-1.5" fill="url(#textGrad)">
        ThesisCheck
    </text>
    
    <!-- Domain Badge .ai -->
    <text x="345" y="60" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="700" fill="#10B981" letter-spacing="-0.5">
        .ai
    </text>
</svg>
