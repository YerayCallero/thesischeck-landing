<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500" fill="none">
    <defs>
        <linearGradient id="hdrShield" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#047857" />
            <stop offset="50%" stop-color="#10B981" />
            <stop offset="100%" stop-color="#34D399" />
        </linearGradient>
        <linearGradient id="hdrText" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#FFFFFF" />
            <stop offset="100%" stop-color="#E2E8F0" />
        </linearGradient>
        <filter id="hdrGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="25" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <pattern id="hdrGrid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
        </pattern>
    </defs>
    
    <!-- Deep Dark Canvas -->
    <rect width="1500" height="500" fill="#0A0D14"/>
    
    <!-- Subtle Blueprint Grid -->
    <rect width="1500" height="500" fill="url(#hdrGrid)"/>
    
    <!-- Emerald Ambient Lighting Spheres -->
    <circle cx="580" cy="180" r="320" fill="#10B981" fill-opacity="0.10" filter="url(#hdrGlow)"/>
    <circle cx="1280" cy="300" r="280" fill="#059669" fill-opacity="0.08" filter="url(#hdrGlow)"/>
    
    <!-- Main Content Group (Positioned to clear avatar at bottom-left) -->
    <g transform="translate(380, 100)">
        
        <!-- Brand Lockup: Shield Icon + Text -->
        <g transform="translate(0, 0)">
            <!-- Shield Icon (84x84) -->
            <rect x="0" y="0" width="84" height="84" rx="22" fill="#10B981" fill-opacity="0.25" filter="url(#hdrGlow)"/>
            <rect x="0" y="0" width="84" height="84" rx="22" fill="url(#hdrShield)" stroke="#6EE7B7" stroke-width="2"/>
            <path d="M26 27 H52 L62 37 V60 C62 61.5 60.5 63 59 63 H29 C27.5 63 26 61.5 26 60 V27 Z" fill="#07090E" fill-opacity="0.25"/>
            <path d="M28 44 L39 55 L58 33" stroke="#07090E" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M28 44 L39 55 L58 33" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
            
            <!-- Typography: ThesisCheck .ai -->
            <text x="110" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5" fill="url(#hdrText)">
                ThesisCheck
            </text>
            <text x="425" y="58" font-family="'JetBrains Mono', monospace" font-size="34" font-weight="700" fill="#10B981">
                .ai
            </text>
        </g>
        
        <!-- Primary Value Proposition -->
        <text x="0" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="600" fill="#94A3B8" letter-spacing="-0.3">
            The Agentic SEC Filing Auditor for Fundamental Investors
        </text>
        
        <text x="0" y="178" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="400" fill="#64748B">
            Cross-examining Form 10-Q &amp; 10-K Catalysts in 60s • Zero-Hallucination Grounding
        </text>
        
        <!-- Badges Bar -->
        <g transform="translate(0, 220)">
            <!-- Badge 1 -->
            <rect x="0" y="0" width="220" height="38" rx="19" fill="#111622" stroke="#1E293B" stroke-width="1.5"/>
            <circle cx="20" cy="19" r="4" fill="#10B981"/>
            <text x="34" y="24" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#CBD5E1">
                Statutory SEC EDGAR
            </text>
            
            <!-- Badge 2 -->
            <rect x="235" y="0" width="225" height="38" rx="19" fill="#111622" stroke="#1E293B" stroke-width="1.5"/>
            <circle cx="255" cy="19" r="4" fill="#10B981"/>
            <text x="269" y="24" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#CBD5E1">
                ASC 450 Footnote Audit
            </text>
            
            <!-- Badge 3 -->
            <rect x="475" y="0" width="210" height="38" rx="19" fill="#111622" stroke="#1E293B" stroke-width="1.5"/>
            <circle cx="495" cy="19" r="4" fill="#10B981"/>
            <text x="509" y="24" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#CBD5E1">
                Live Audit Samples
            </text>
        </g>
    </g>
    
    <!-- Top Right Canonical URL Tag -->
    <g transform="translate(1220, 50)">
        <rect x="0" y="0" width="220" height="36" rx="8" fill="#111622" stroke="#1E293B" stroke-width="1.5"/>
        <text x="25" y="23" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#10B981">
            thesischeckai.com
        </text>
    </g>
    
    <!-- Bottom Border Accent Line -->
    <rect x="0" y="496" width="1500" height="4" fill="url(#hdrShield)"/>
</svg>
